[package]
name = "forever-world"
version = "1.1.1"
edition = "2024"
license-file = "LICENSE"
publish = false
description = "Define, lock, export, and publish the Forever World modpack."

[[bin]]
name = "pack"
path = "src/main.rs"

[dependencies]
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
quick-xml = { version = "0.38", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
