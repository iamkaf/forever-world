name: Set up Swatch
description: Build the reviewed Swatch source revision with its locked dependencies.

runs:
  using: composite
  steps:
    - name: Install Rust 1.96.0
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: 1.96.0

    - name: Install Swatch 0.2.0
      shell: bash
      env:
        SWATCH_REVISION: 167a2e4527857cfcb467cb449c35acdaf0fb933a
        SWATCH_VERSION: 0.2.0
      run: |
        set -euo pipefail
        install_root="$RUNNER_TEMP/swatch-$SWATCH_VERSION"
        cargo install \
          --git https://github.com/iamkaf/swatch.git \
          --rev "$SWATCH_REVISION" \
          --version "$SWATCH_VERSION" \
          --locked \
          --root "$install_root" \
          swatch
        actual_version=$("$install_root/bin/swatch" --version)
        if [[ "$actual_version" != "swatch $SWATCH_VERSION" ]]; then
          echo "expected swatch $SWATCH_VERSION, got $actual_version" >&2
          exit 1
        fi
        printf '%s\n' "$install_root/bin" >> "$GITHUB_PATH"
