name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching pack.toml, such as v1.2.0
        required: true
        type: string
      publish:
        description: Publish the verified release to configured targets
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pack-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Test, prepare, sign, and attest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Swatch
        uses: ./.github/actions/setup-swatch
        with:
          github-token: ${{ github.token }}

      - name: Set up Modstage
        uses: ./.github/actions/setup-modstage

      - name: Validate the release request
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pack.toml | head -n 1)"
          test "$TAG" = "v$version"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"
          fi
          test "$(swatch --version)" = "swatch 0.3.0"
          swatch install
          scripts/check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Run the production pair under Xvfb
        run: scripts/check-runtime

      - name: Prepare and verify release bytes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          swatch prepare
          swatch verify
          release_error="$RUNNER_TEMP/swatch-release-error"
          if release_assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '[.assets[].name]' 2>"$release_error")"; then
            :
          elif grep -Fq '(HTTP 404)' "$release_error"; then
            release_assets='[]'
          else
            cat "$release_error" >&2
            exit 1
          fi
          existing_release="$RUNNER_TEMP/swatch-existing-release"
          mkdir -p "$existing_release"
          if jq -e 'index("release.json") != null' <<<"$release_assets" >/dev/null; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern release.json --dir "$existing_release"
            cmp --silent dist/release.json "$existing_release/release.json"
          fi
          if jq -e 'index("release.json.sigstore.json") != null' \
            <<<"$release_assets" >/dev/null; then
            test -f "$existing_release/release.json"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern release.json.sigstore.json --dir "$existing_release"
            cosign verify-blob \
              --bundle "$existing_release/release.json.sigstore.json" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              dist/release.json
            cp "$existing_release/release.json.sigstore.json" \
              dist/release.json.sigstore.json
          else
            cosign sign-blob --yes \
              --bundle dist/release.json.sigstore.json \
              dist/release.json
          fi

      - name: Attest prepared files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Verify signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          swatch verify
          cosign verify-blob \
            --bundle dist/release.json.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/release.json
          for file in dist/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"
          done

      - name: Retain verified release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-pack-release
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  publish:
    name: Publish verified release
    needs: prepare
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pack-release
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Swatch
        uses: ./.github/actions/setup-swatch
        with:
          github-token: ${{ github.token }}

      - name: Download verified release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-pack-release
          path: dist

      - name: Reverify and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MAVEN_PUBLISH_USERNAME: ${{ secrets.MAVEN_PUBLISH_USERNAME }}
          MAVEN_PUBLISH_PASSWORD: ${{ secrets.MAVEN_PUBLISH_PASSWORD }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pack.toml | head -n 1)"
          test "$TAG" = "v$version"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"
          fi
          swatch verify
          cosign verify-blob \
            --bundle dist/release.json.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/release.json
          for file in dist/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"
          done
          swatch publish
