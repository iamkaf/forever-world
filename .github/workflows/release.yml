name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare once
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate clean tag source
        run: >-
          python3 scripts/artifact_proof.py validate-source
          --tag "$GITHUB_REF_NAME"
          --require-publishable

      - name: Check pack policy
        run: python3 scripts/check_pack_policy.py

      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Typecheck TeaKit smoke
        run: |
          java -version
          saved_tsconfig="$RUNNER_TEMP/tsconfig.json"
          cp tsconfig.json "$saved_tsconfig"
          trap 'cp "$saved_tsconfig" tsconfig.json' EXIT
          ./teakitw typecheck --timeout 120

      - name: Set up Swatch
        uses: ./.github/actions/setup-swatch

      - name: Verify locked install
        run: |
          set -euo pipefail
          swatch install
          git diff --exit-code -- pack.toml pack.lock.toml overrides.toml release.toml

      - name: Prepare every destination from the locked pack
        run: python3 scripts/artifact_proof.py prepare --output build/release

      - name: Confirm preparation left the source clean
        run: >-
          python3 scripts/artifact_proof.py validate-source
          --tag "$GITHUB_REF_NAME"
          --require-publishable

      - name: Preserve prepared bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-release
          path: build/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  sign:
    name: Sign and attest
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download prepared bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prepared-release
          path: release

      - name: Verify prepared hashes
        run: python3 scripts/artifact_proof.py verify --directory release --tag "$GITHUB_REF_NAME"

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Keyless-sign the release manifest
        run: |
          cosign sign-blob --yes \
            --bundle release/release-manifest.sigstore.json \
            release/release-manifest.json

      - name: Create GitHub provenance attestations
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

      - name: Preserve the GitHub attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" release/github-provenance.jsonl

      - name: Preserve signed bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  verify:
    name: Verify signed release
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download signed bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release
          path: release

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Verify hashes and archive contents
        run: >-
          python3 scripts/artifact_proof.py verify
          --directory release
          --tag "$GITHUB_REF_NAME"
          --allow-proof

      - name: Verify the Sigstore identity
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          cosign verify-blob \
            --bundle release/release-manifest.sigstore.json \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            release/release-manifest.json

      - name: Verify GitHub provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while read -r _ name; do
            gh attestation verify "release/$name" \
              --bundle release/github-provenance.jsonl \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF"
          done < release/SHA256SUMS

      - name: Preserve verified bytes for publishers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  github:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Download verified bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository=$(jq --raw-output \
            '.destinations.github.repository' release/release-manifest.json)
          [[ "$repository" == "$GITHUB_REPOSITORY" ]] || {
            echo "signed GitHub destination does not match this repository" >&2
            exit 1
          }
          gh release create "$GITHUB_REF_NAME" \
            --repo "$repository" \
            --verify-tag \
            --title "Forever World ${GITHUB_REF_NAME#v}" \
            --notes-file release/release-notes.md \
            release/*

  maven:
    name: Publish Maven release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: maven-release
    env:
      MAVEN_READ_REPOSITORY: https://maven.kaf.sh
    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release
          path: release

      - name: Require Maven credentials
        env:
          MAVEN_PUBLISH_PASSWORD: ${{ secrets.MAVEN_PUBLISH_PASSWORD }}
          MAVEN_PUBLISH_USERNAME: ${{ secrets.MAVEN_PUBLISH_USERNAME }}
        run: |
          if [[ -z "$MAVEN_PUBLISH_USERNAME" ]]; then
            echo "MAVEN_PUBLISH_USERNAME is not configured" >&2
            exit 1
          fi
          if [[ -z "$MAVEN_PUBLISH_PASSWORD" ]]; then
            echo "MAVEN_PUBLISH_PASSWORD is not configured" >&2
            exit 1
          fi

      - name: Upload signed Maven files
        env:
          MAVEN_PUBLISH_PASSWORD: ${{ secrets.MAVEN_PUBLISH_PASSWORD }}
          MAVEN_PUBLISH_USERNAME: ${{ secrets.MAVEN_PUBLISH_USERNAME }}
        run: |
          set -euo pipefail
          version=$(jq --raw-output '.pack.version' release/release-manifest.json)
          group_path=$(jq --raw-output \
            '.pack.group | gsub("\\."; "/")' release/release-manifest.json)
          slug=$(jq --raw-output '.pack.slug' release/release-manifest.json)
          mrpack=$(jq --raw-output \
            '.artifacts[] | select(.kind == "client-pack") | .name' \
            release/release-manifest.json)
          pom=$(jq --raw-output \
            '.artifacts[] | select(.kind == "maven-pom") | .name' \
            release/release-manifest.json)
          metadata=$(jq --raw-output \
            '.artifacts[] | select(.kind == "maven-metadata") | .name' \
            release/release-manifest.json)
          repository=$(jq --raw-output \
            '.destinations.maven.repository' release/release-manifest.json)
          base="$repository/$group_path/$slug"
          read_base="$MAVEN_READ_REPOSITORY/$group_path/$slug"
          upload() {
            local source="$1"
            local destination="$2"
            local read_destination="$3"
            local status
            status=$(curl --silent --show-error \
              --user-agent forever-world-release/1 \
              --header 'Cache-Control: no-cache' \
              --output "$RUNNER_TEMP/existing" --write-out '%{http_code}' \
              "$read_destination?release_check=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
            if [[ "$status" == "200" ]]; then
              if cmp --silent "$source" "$RUNNER_TEMP/existing"; then
                return
              fi
              echo "Maven already has different bytes at $destination" >&2
              exit 1
            fi
            [[ "$status" == "200" || "$status" == "404" ]] || {
              echo "Maven lookup failed with HTTP $status at $destination" >&2
              exit 1
            }
            curl --fail --show-error --silent \
              --user-agent forever-world-release/1 \
              --user "$MAVEN_PUBLISH_USERNAME:$MAVEN_PUBLISH_PASSWORD" \
              --upload-file "$source" "$destination"
          }
          for name in "$mrpack" "$pom"; do
            upload "release/$name" "$base/$version/$name" "$read_base/$version/$name"
            upload "release/$name.sha256" "$base/$version/$name.sha256" "$read_base/$version/$name.sha256"
            upload "release/$name.sha512" "$base/$version/$name.sha512" "$read_base/$version/$name.sha512"
          done
          python3 scripts/maven_conditional_upload.py \
            --source "release/$metadata" \
            --destination "$base/$metadata" \
            --read-destination "$base/$metadata?release_check=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  curseforge:
    name: Publish CurseForge release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: curseforge-release
    steps:
      - name: Download verified bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release
          path: release

      - name: Require CurseForge project setup
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          project=$(jq --raw-output \
            '.destinations.curseforge.project' release/release-manifest.json)
          [[ "$project" =~ ^[1-9][0-9]*$ ]] || {
            echo "signed CurseForge project ID is not configured" >&2
            exit 1
          }
          if [[ -z "$CURSEFORGE_TOKEN" ]]; then
            echo "CURSEFORGE_TOKEN is not configured" >&2
            exit 1
          fi

      - name: Upload the 47-file CurseForge edition
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          set -euo pipefail
          version=$(jq --raw-output '.pack.version' release/release-manifest.json)
          name=$(jq --raw-output '.pack.name' release/release-manifest.json)
          minecraft=$(jq --raw-output '.pack.minecraft' release/release-manifest.json)
          loader=$(jq --raw-output \
            '.pack.loader | (.[0:1] | ascii_upcase) + .[1:]' \
            release/release-manifest.json)
          artifact=$(jq --raw-output \
            '.artifacts[] | select(.kind == "curseforge-pack") | .name' \
            release/release-manifest.json)
          project=$(jq --raw-output \
            '.destinations.curseforge.project' release/release-manifest.json)
          jq --null-input \
            --rawfile changelog release/release-notes.md \
            --arg displayName "$name $version" \
            --arg minecraft "$minecraft" \
            --arg loader "$loader" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $displayName,
              gameVersionNames: [$loader, $minecraft],
              releaseType: "release"
            }' > "$RUNNER_TEMP/curseforge-metadata.json"
          curl --fail --show-error --silent \
            --header "X-Api-Token: $CURSEFORGE_TOKEN" \
            --form "metadata=<$RUNNER_TEMP/curseforge-metadata.json;type=application/json" \
            --form "file=@release/$artifact;type=application/zip" \
            "https://minecraft.curseforge.com/api/projects/$project/upload-file"
