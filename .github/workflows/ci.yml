name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check locked pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Swatch
        uses: ./.github/actions/setup-swatch
        with:
          github-token: ${{ github.token }}

      - name: Check locked release artifacts
        run: |
          set -euo pipefail
          test "$(swatch --version)" = "swatch 0.3.0"
          swatch install
          scripts/check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          swatch prepare
          swatch verify

      - name: Set up Modstage
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/setup-modstage

      - name: Run the production pair under Xvfb
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: scripts/check-runtime
