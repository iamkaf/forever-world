name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-integrity:
    name: Release integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check pack policy
        run: |
          python3 scripts/check_pack_policy.py
          python3 scripts/test_render_modstage.py
          python3 scripts/test_maven_conditional_upload.py

      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Typecheck TeaKit smoke
        run: |
          java -version
          saved_tsconfig="$RUNNER_TEMP/tsconfig.json"
          cp tsconfig.json "$saved_tsconfig"
          trap 'cp "$saved_tsconfig" tsconfig.json' EXIT
          ./teakitw typecheck --timeout 120

      - name: Set up Swatch
        uses: ./.github/actions/setup-swatch

      - name: Verify locked install
        run: |
          set -euo pipefail
          test "$(swatch --version)" = "swatch 0.2.0"
          swatch install
          git diff --exit-code -- pack.toml pack.lock.toml overrides.toml release.toml

      - name: Dry-prepare and prove release artifacts
        run: python3 scripts/artifact_proof.py prepare
