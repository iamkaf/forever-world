name: Recover Modrinth

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed Forever World release tag, such as v1.2.0
        required: true
        type: string
      replace_version_id:
        description: Exact Modrinth version to replace after its bytes are verified
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: modrinth-recovery-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  recover:
    name: Verify and recreate the Modrinth version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pack-release
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Download the signed GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir release
          version="${TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          for asset in \
            "forever-world-$version-client.mrpack" \
            github-provenance.jsonl \
            release-manifest.json \
            release-manifest.sigstore.json \
            release-notes.md
          do
            gh release download "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir release \
              --pattern "$asset"
          done

      - name: Verify the release proof and client bytes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          test "$TAG" = "v$version"
          test "$(jq -er '.pack.version' release/release-manifest.json)" = "$version"
          artifact=$(jq -er \
            '.artifacts | map(select(.kind == "client-pack")) | if length == 1 then .[0].name else error("missing or duplicate client pack") end' \
            release/release-manifest.json)
          test "$artifact" = "forever-world-$version-client.mrpack"
          sha256=$(jq -er --arg artifact "$artifact" \
            '.artifacts[] | select(.name == $artifact) | .sha256' \
            release/release-manifest.json)
          sha512=$(jq -er --arg artifact "$artifact" \
            '.artifacts[] | select(.name == $artifact) | .sha512' \
            release/release-manifest.json)
          printf '%s  %s\n' "$sha256" "release/$artifact" | sha256sum --check --strict
          printf '%s  %s\n' "$sha512" "release/$artifact" | sha512sum --check --strict
          unzip -t "release/$artifact"
          cosign verify-blob \
            --bundle release/release-manifest.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            release/release-manifest.json
          gh attestation verify "release/$artifact" \
            --bundle release/github-provenance.jsonl \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$TAG"

      - name: Verify and remove the replaced Modrinth version
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          REPLACE_VERSION_ID: ${{ inputs.replace_version_id }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -n "$MODRINTH_TOKEN"
          [[ "$REPLACE_VERSION_ID" =~ ^[A-Za-z0-9]{8}$ ]]
          version="${TAG#v}"
          project=$(jq -er '.destinations.modrinth.project' release/release-manifest.json)
          artifact=$(jq -er \
            '.artifacts[] | select(.kind == "client-pack") | .name' \
            release/release-manifest.json)
          sha512=$(jq -er --arg artifact "$artifact" \
            '.artifacts[] | select(.name == $artifact) | .sha512' \
            release/release-manifest.json)
          response="$RUNNER_TEMP/replaced-version.json"
          code=$(curl --show-error --silent \
            --output "$response" \
            --write-out '%{http_code}' \
            --header "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/version/$REPLACE_VERSION_ID")
          case "$code" in
            200)
              test "$(jq -er '.id' "$response")" = "$REPLACE_VERSION_ID"
              test "$(jq -er '.project_id' "$response")" = "$project"
              test "$(jq -er '.version_number' "$response")" = "$version"
              jq -e --arg artifact "$artifact" --arg sha512 "$sha512" \
                '.files | any(.filename == $artifact and .hashes.sha512 == $sha512)' \
                "$response"
              curl --fail-with-body --show-error --silent \
                --request DELETE \
                --header "Authorization: $MODRINTH_TOKEN" \
                "https://api.modrinth.com/v2/version/$REPLACE_VERSION_ID"
              ;;
            404)
              ;;
            *)
              cat "$response" >&2
              exit 1
              ;;
          esac

      - name: Create and verify the Modrinth version
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          REPLACE_VERSION_ID: ${{ inputs.replace_version_id }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name=$(jq -er '.pack.name' release/release-manifest.json)
          minecraft=$(jq -er '.pack.minecraft' release/release-manifest.json)
          loader=$(jq -er '.pack.loader' release/release-manifest.json)
          project=$(jq -er '.destinations.modrinth.project' release/release-manifest.json)
          artifact=$(jq -er \
            '.artifacts[] | select(.kind == "client-pack") | .name' \
            release/release-manifest.json)
          sha512=$(jq -er --arg artifact "$artifact" \
            '.artifacts[] | select(.name == $artifact) | .sha512' \
            release/release-manifest.json)
          versions="$RUNNER_TEMP/project-versions-before-create.json"
          curl --fail-with-body --show-error --silent \
            --output "$versions" \
            --header "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/project/$project/version?include_changelog=false"
          existing_id=$(jq -er --arg version "$version" --arg artifact "$artifact" --arg sha512 "$sha512" \
            '[.[] | select(.version_number == $version and (.files | any(.filename == $artifact and .hashes.sha512 == $sha512)))] | if length == 0 then "" elif length == 1 then .[0].id else error("duplicate matching versions") end' \
            "$versions")
          if test -n "$existing_id"; then
            printf 'Modrinth already has verified version %s\n' "$existing_id"
            exit 0
          fi
          jq -e --arg version "$version" 'all(.version_number != $version)' "$versions"
          jq --null-input \
            --rawfile changelog release/release-notes.md \
            --arg name "$name" \
            --arg project "$project" \
            --arg version "$version" \
            --arg minecraft "$minecraft" \
            --arg loader "$loader" \
            '{
              name: ($name + " " + $version),
              version_number: $version,
              changelog: $changelog,
              dependencies: [],
              version_type: "release",
              loaders: [$loader],
              game_versions: [$minecraft],
              project_id: $project,
              file_parts: ["file"],
              primary_file: "file"
            }' > "$RUNNER_TEMP/modrinth-data.json"
          curl --fail-with-body --show-error --silent \
            --output "$RUNNER_TEMP/created-version.json" \
            --header "Authorization: $MODRINTH_TOKEN" \
            --form "data=<$RUNNER_TEMP/modrinth-data.json;type=application/json" \
            --form "file=@release/$artifact;type=application/zip" \
            https://api.modrinth.com/v2/version
          created="$RUNNER_TEMP/created-version.json"
          created_id=$(jq -er '.id' "$created")
          test "$created_id" != "$REPLACE_VERSION_ID"
          test "$(jq -er '.project_id' "$created")" = "$project"
          test "$(jq -er '.version_number' "$created")" = "$version"
          jq -e --arg artifact "$artifact" --arg sha512 "$sha512" \
            '.files | any(.filename == $artifact and .hashes.sha512 == $sha512)' \
            "$created"
          versions="$RUNNER_TEMP/project-versions.json"
          curl --fail-with-body --show-error --silent \
            --output "$versions" \
            --header "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/project/$project/version?include_changelog=false"
          jq -e --arg id "$created_id" --arg artifact "$artifact" --arg sha512 "$sha512" \
            'any(.id == $id and (.files | any(.filename == $artifact and .hashes.sha512 == $sha512)))' \
            "$versions"
          printf 'Modrinth version %s\n' "$created_id"
